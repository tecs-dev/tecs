[workspace]
members = [
    "native/rust/runtime",
    "native/rust/build-support",
    "xtask",
]
default-members = ["native/rust/runtime"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
bincode = "1.3"
bytes = "1"
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
clap_complete = { version = "4.6.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rapier2d = { version = "0.34.0", default-features = false, features = ["dim2", "enhanced-determinism", "f32", "parallel", "serde-serialize"] }
rayon = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["deflate", "gzip", "rustls-no-provider", "socks", "stream"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
regex = "1.12"
rmcp = { version = "3.0.0", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sdl3-sys = { version = "=0.6.7", default-features = false, features = ["no-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2.0"
tempfile = "3.27"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
walkdir = "2.5"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
