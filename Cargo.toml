[workspace]
members = [
    "native/rust/build-support",
    "native/rust/physics",
    "native/rust/tecs-audio",
    "native/rust/tecs-gamepad",
    "native/rust/winit-host",
    "xtask",
]
default-members = ["native/rust/winit-host"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
bevy_mikktspace = { version = "1.0.0", features = ["corrected-edge-sorting", "corrected-vertex-welding"] }
bincode = "1.3"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc", "min_const_generics"] }
bytes = "1"
camino = "1.2"
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
clap_complete = { version = "4.6.4", default-features = false }
cpal = "0.18.2"
data-url = "0.3.2"
draco_decoder = "0.0.29"
fastnoise-lite = { version = "1.1.1", default-features = false, features = ["f64", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gilrs = "0.11.2"
glam = "0.33.2"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "extensions", "KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
ktx2 = "0.5.0"
libc = "0.2"
meshopt = "0.6.2"
mio = { version = "1", features = ["net", "os-poll"] }
path-clean = "1.0"
pathdiff = { version = "0.2", features = ["camino"] }
pollster = "0.4"
rapier2d = { version = "0.34.0", default-features = false, features = ["dim2", "enhanced-determinism", "f32", "parallel", "serde-serialize"] }
rayon = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["deflate", "gzip", "rustls-no-provider", "socks", "stream"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
regex = "1.12"
rmcp = { version = "3.0.0", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
shaderc = { version = "0.10.1", features = ["build-from-source", "prefer-static-linking"] }
spirv-cross2 = { version = "0.7.1", default-features = false, features = ["msl"] }
shlex = "2.0"
symphonia = { version = "0.6.1", features = ["mp3"] }
tempfile = "3.27"
taffy = { version = "0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.9"
uuid = { version = "1.24", features = ["v4", "v7"] }
url = "2.5"
urlencoding = "2.1.3"
walkdir = "2.5"
wgpu = "30.0.1"
winit = "0.30.13"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
