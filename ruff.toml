# Python, for the build's own tooling under scripts/. Formatting only: nothing
# here lints, because the scripts are small and the build is the check.
line-length = 120
indent-width = 4
target-version = "py39"

[format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
# Comments are prose here, wrapped by hand. Ruff does not reflow them, and
# docstring code is left as written for the same reason.
docstring-code-format = false
