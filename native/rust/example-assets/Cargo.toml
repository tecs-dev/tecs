[package]
name = "tecs-example-assets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
bistro-import = ["dep:draco_decoder", "dep:image_dds", "dep:sha2"]

[dependencies]
anyhow.workspace = true
image.workspace = true
ktx2.workspace = true
serde_json.workspace = true
draco_decoder = { version = "0.0.29", optional = true }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"], optional = true }
sha2 = { version = "0.10", optional = true }
