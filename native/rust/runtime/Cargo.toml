[package]
name = "tecs-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
payload = ["dep:flate2"]

[dependencies]
bincode = "1.3"
clap = { version = "4.6.4", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
rapier2d = { version = "0.34.0", default-features = false, features = ["dim2", "enhanced-determinism", "f32", "parallel", "serde-serialize"] }
rayon = "1.12"
reqwest = { version = "0.13.4", default-features = false, features = ["deflate", "gzip", "rustls-no-provider", "socks", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sdl3-sys = { version = "=0.6.7", default-features = false, features = ["no-link"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
