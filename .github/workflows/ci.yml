name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Pin the Teal compiler to a known-good commit. Tracking tl's HEAD is not
# reproducible: tl ed9ff687 (2026-05-21) added a stricter "goto jumps into
# scope of a local variable" check that rejects our `goto ::continue::` loop
# idiom (valid under LuaJIT 5.1, which we target). This is the parent commit,
# just before that check.
env:
  TL_REF: 4b97e8d4c743795cb148c898fb19e14b6f3b8f2d

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup LuaJIT
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "luajit"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4
      with:
        luarocksVersion: "3.12.2"

    - name: Install dependencies
      run: |
        luarocks install busted
        luarocks install luacov
        git clone https://github.com/teal-language/tl.git /tmp/tl-dev
        cd /tmp/tl-dev && git checkout "$TL_REF"
        luarocks make tl-dev-1.rockspec

    - name: Build project
      run: |
        make clean
        make compile

    - name: Run tests
      run: |
        make test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Lua
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "luajit"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4
      with:
        luarocksVersion: "3.12.2"

    - name: Install Teal
      run: |
        git clone https://github.com/teal-language/tl.git /tmp/tl-dev
        cd /tmp/tl-dev && git checkout "$TL_REF"
        luarocks make tl-dev-1.rockspec

    - name: Type check
      run: make check
