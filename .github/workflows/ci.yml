name: ci

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    rust:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
                    libx11-dev libxcursor-dev libxi-dev libxrandr-dev
            - run: cargo fmt --all -- --check
            # `tecs-winit-host` is excluded from everything that builds it here.
            # Its build script links `libnupp.a` out of a Nupp embedding SDK,
            # and staging one needs the Nupp compiler's own checkout and a
            # matching Rust compiler. Neither is provisioned from Nupp in this
            # job, so the crate's build script fails before Clippy sees
            # a line of it. The `host` job installs both and covers the crate
            # there. `cargo fmt` needs no build, so it still covers the whole
            # workspace.
            - run: cargo clippy --locked --workspace --exclude tecs-winit-host --all-targets -- -D warnings
            - if: runner.os == 'Windows'
              run: cargo check --locked --workspace --exclude tecs-winit-host --all-targets
            - if: runner.os != 'Windows'
              run: cargo test --locked --workspace --exclude tecs-winit-host --all-targets

    nupp:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-15, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        env:
            # This revision includes the cold file-reader repair and the bounded
            # binary codec used by snapshot_save and snapshot_load.
            NUPP_REF: e3247bea2f32847e0ee20d1960a1d72b402666ed
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./scripts/toolchain --all
                  ./bin/nupp build --target bootstrapCompiler
                  # The launcher runs the compiler target; bootstrapCompiler
                  # alone leaves a fresh checkout using the older stage zero.
                  ./bin/nupp build --target compiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - working-directory: tecs
              run: nupp fmt --check
            # The rest of the formatters, on one runner. Formatting is platform
            # independent, and the two the suffix table dispatches to are
            # exactly what `deps` installs, so running the whole check twice
            # would only pay for Homebrew twice.
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: nupp task deps
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: nupp task format-check
            - working-directory: tecs
              run: nupp check --strict
            - working-directory: tecs
              run: nupp task test-tools
            - if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
                    libx11-dev libxcursor-dev libxi-dev libxrandr-dev
            # Build the native libraries, then require every suite and case to
            # execute successfully. Missing bindings and offline-open failures
            # cannot turn this integration gate green through skipped tests.
            - working-directory: tecs
              run: nupp test
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: nupp-tests-${{ matrix.os }}
                  path: tecs/out/validation/nupp-tests.json
            - working-directory: tecs
              run: nupp build --target headless
            - working-directory: tecs
              run: nupp build --target ex-host
            - working-directory: tecs
              run: nupp build --target ex-flatcolor

    # Independent checkouts: start execution gates alongside the source tests.
    # The workflow still requires every job; no artifacts flow between them.
    host:
        runs-on: macos-15
        env:
            NUPP_REF: e3247bea2f32847e0ee20d1960a1d72b402666ed
        steps:
            # Two checkouts side by side. The Nupp compiler release installed by
            # Homebrew ships no `libnupp.a`, so it cannot satisfy
            # `native/rust/winit-host/build.rs`; the embedding SDK is staged by
            # the compiler's own `scripts/toolchain`, which only a source
            # checkout has. `build.rs` searches every ancestor for
            # `nupp/scripts/toolchain`, so `tecs/` beside `nupp/` is the layout
            # it resolves.
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./scripts/toolchain --all
                  ./bin/nupp build --target bootstrapCompiler
                  # The launcher runs the compiler target; bootstrapCompiler
                  # alone leaves a fresh checkout using the older stage zero.
                  ./bin/nupp build --target compiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - name: Stage the Nupp embedding SDK
              working-directory: tecs
              run: echo "NUPP_SDK=$(../nupp/scripts/toolchain host-library base,native-files,native-net | tail -1)" >> "$GITHUB_ENV"
            - working-directory: tecs
              run: nupp build --target ex-host
            - working-directory: tecs
              run: cargo fmt -p tecs-winit-host -- --check
            - working-directory: tecs
              run: cargo clippy -p tecs-winit-host --all-targets -- -D warnings
            # No loader path is exported here. The build script records the
            # SDK as a run path, because the static library references the
            # embedding library beside it and a binary that linked cleanly
            # otherwise aborts at startup.
            - working-directory: tecs
              run: cargo build --locked -p tecs-audio -p tecs-gamepad -p tecs-physics
            - working-directory: tecs
              run: cargo test -p tecs-winit-host
            - working-directory: tecs
              run: cargo run -p tecs-winit-host -- --headless --frames 1
            # Every component, not just the smallest. A module that only the
            # richer examples reach is exactly where the last regression hid:
            # the suites run in the full Nupp runtime and never load a
            # component, so this is the only step that reads the reduced one.
            - working-directory: tecs
              run: nupp task ex-flatcolor --headless --frames 2
            - working-directory: tecs
              run: nupp task ex-sprites --headless --frames 3
            - working-directory: tecs
              run: nupp task ex-lighting --headless --frames 5
            # Every real consumer reaches a native service through a guarded
            # require, so a host with no libraries staged looks healthy. This
            # component requires all three directly and raises on the first
            # that will not load.
            - working-directory: tecs
              run: nupp task ex-nativesmoke --headless --frames 2

    # The release half. It is separate from `host` because it proves a
    # different thing: that half builds and runs out of a checkout, and this
    # half builds an install that carries no path back to the checkout and
    # still runs after it moves.
    #
    # Both supported Unix platforms are covered, because the run path a release
    # records is spelled differently on each and only the platform can say
    # whether its loader honours it for a library opened by name at run time.
    # Windows is not here: no runner in this workflow stages a Nupp SDK for
    # MSVC yet, so `windows-x64` is configured and unproven.
    package:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15
                      preset: macos-arm64
                    - os: ubuntu-latest
                      preset: linux-x64
        runs-on: ${{ matrix.os }}
        env:
            NUPP_REF: e3247bea2f32847e0ee20d1960a1d72b402666ed
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            # `winit`, `wgpu`, `cpal` and `gilrs` each want a development
            # package on Linux, and the host links all four. macOS reaches the
            # same services through frameworks that are already installed.
            - if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
                    libx11-dev libxcursor-dev libxi-dev libxrandr-dev
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./scripts/toolchain --all
                  ./bin/nupp build --target bootstrapCompiler
                  # The launcher runs the compiler target; bootstrapCompiler
                  # alone leaves a fresh checkout using the older stage zero.
                  ./bin/nupp build --target compiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - name: Stage the Nupp embedding SDK
              working-directory: tecs
              run: echo "NUPP_SDK=$(../nupp/scripts/toolchain host-library base,native-files,native-net | tail -1)" >> "$GITHUB_ENV"
            # One command: it installs a clean release, holds it to
            # `check-package`, copies it somewhere unrelated, and runs the
            # native smoke component and the showcase from there with every
            # Tecs override removed from the environment.
            - working-directory: tecs
              run: nupp task test-package --preset ${{ matrix.preset }}
            # The development preset exists to be told apart from a release.
            # Packaging one and checking it is what keeps that distinction
            # working, since a release passing the gate proves nothing if the
            # gate passes everything. One platform is enough: what it exercises
            # is the preset kind, not the loader, and it pays for a whole debug
            # build of the graphics stack.
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: nupp task package --preset ${{ matrix.preset }}-dev
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: nupp task check-package

    # The site is the Nupp compiler's own render of the declarations it checks,
    # so this job needs the compiler and nothing else. It does not need the
    # embedding SDK: no component is built here.
    docs:
        runs-on: macos-15
        permissions:
            contents: read
            pages: write
            id-token: write
        env:
            NUPP_REF: e3247bea2f32847e0ee20d1960a1d72b402666ed
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./scripts/toolchain --all
                  ./bin/nupp build --target bootstrapCompiler
                  # The launcher runs the compiler target; bootstrapCompiler
                  # alone leaves a fresh checkout using the older stage zero.
                  ./bin/nupp build --target compiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - name: Install the Nupp documentation dependencies
              working-directory: nupp
              run: ./bin/nupp build --target docs
            - working-directory: tecs
              run: nupp task docs-check
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              working-directory: tecs
              run: nupp build --target docs
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: tecs/out/docs

    deploy-docs:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: github-pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
