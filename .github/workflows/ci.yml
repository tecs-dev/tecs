name: ci

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    TECS_WERROR: "1"

jobs:
    rust:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - run: cargo fmt --all -- --check
            # `tecs-winit-host` is excluded from everything that builds it here.
            # Its build script links `libnupp.a` out of a Nupp embedding SDK,
            # and staging one needs the Nupp compiler's own checkout and a
            # compiler newer than `rust-toolchain.toml` pins. Neither is present
            # on this job, so the crate's build script fails before Clippy sees
            # a line of it. The `nupp-host` job installs both and covers the
            # crate there. `cargo fmt` needs no build, so it still covers the
            # whole workspace.
            - run: cargo clippy --locked --workspace --exclude tecs-winit-host --all-targets -- -D warnings
            - if: runner.os == 'Windows'
              run: cargo check --locked --workspace --exclude tecs-winit-host --all-targets
            - if: runner.os != 'Windows'
              run: cargo test --locked --workspace --exclude tecs-winit-host --all-targets

    engine:
        runs-on: macos-15
        env:
            TECS_EXPECT_GPU_DRIVER: metal
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: cargo xtask deps
            - run: cargo xtask check
            - run: cargo xtask format-check
            - run: cargo xtask test
            - run: cargo xtask test-package --preset macos-arm64

    engine-vulkan:
        runs-on: ubuntu-latest
        env:
            LIBGL_ALWAYS_SOFTWARE: "1"
            SDL_GPU_DRIVER: vulkan
            TECS_EXPECT_GPU_DRIVER: vulkan
        steps:
            - uses: actions/checkout@v4
            - run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential cmake ninja-build pkg-config luajit xvfb \
                    libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
                    libgbm-dev libpulse-dev libudev-dev libvulkan-dev \
                    libwayland-dev libx11-dev libxcursor-dev libxext-dev \
                    libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
                    mesa-vulkan-drivers wayland-protocols
            - run: cargo xtask dev-tools
            - run: xvfb-run -a cargo xtask test --preset linux-x64

    nupp:
        strategy:
            matrix:
                os: [macos-15, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        env:
            # A commit, not a release. The tree needs `Carry standard modules in
            # components` and `Carry seam providers in components`, and v0.0.1
            # is still the only tag and predates both, so a released compiler
            # cannot check this tree or load a component it builds. Move this to
            # a tag once one carries them.
            NUPP_REF: b13848d0a8b9d363b7f35f43a8a4c21674ff7025
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./bin/nupp build --target bootstrapCompiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - working-directory: tecs
              run: nupp fmt --check
            - working-directory: tecs
              run: nupp check --strict
            # The native service tests skip when their library is absent, so
            # building them is what makes the three Nupp-to-Rust bindings
            # covered rather than reported as skipped. The loader finds the
            # Cargo target directory itself; nothing has to be staged.
            - working-directory: tecs
              run: cargo build -p tecs-audio -p tecs-physics -p tecs-gamepad
            - working-directory: tecs
              run: nupp test
            - working-directory: tecs
              run: nupp build --target headless
            - working-directory: tecs
              run: nupp build --target host
            - working-directory: tecs
              run: nupp build --target flatcolor

    nupp-host:
        needs: nupp
        runs-on: macos-15
        env:
            NUPP_REF: b13848d0a8b9d363b7f35f43a8a4c21674ff7025
        steps:
            # Two checkouts side by side. The Nupp compiler release installed by
            # Homebrew ships no `libnupp.a`, so it cannot satisfy
            # `native/rust/winit-host/build.rs`; the embedding SDK is staged by
            # the compiler's own `scripts/toolchain`, which only a source
            # checkout has. `build.rs` searches every ancestor for
            # `nupp/scripts/toolchain`, so `tecs/` beside `nupp/` is the layout
            # it resolves.
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./bin/nupp build --target bootstrapCompiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - name: Stage the Nupp embedding SDK
              working-directory: tecs
              run: echo "NUPP_SDK=$(../nupp/scripts/toolchain host-library base,native-files,native-net | tail -1)" >> "$GITHUB_ENV"
            - working-directory: tecs
              run: nupp build --target host
            - working-directory: tecs
              run: cargo fmt -p tecs-winit-host -- --check
            - working-directory: tecs
              run: cargo clippy -p tecs-winit-host --all-targets -- -D warnings
            # No loader path is exported here. The build script records the
            # SDK as a run path, because the static library references the
            # embedding library beside it and a binary that linked cleanly
            # otherwise aborts at startup.
            - working-directory: tecs
              run: cargo test -p tecs-winit-host
            - working-directory: tecs
              run: cargo run -p tecs-winit-host -- --headless --frames 1
            # Every component, not just the smallest. A module that only the
            # richer examples reach is exactly where the last regression hid:
            # the suites run in the full Nupp runtime and never load a
            # component, so this is the only step that reads the reduced one.
            - working-directory: tecs
              run: cargo xtask nupp run flatcolor -- --headless --frames 2
            - working-directory: tecs
              run: cargo xtask nupp run sprites -- --headless --frames 3
            - working-directory: tecs
              run: cargo xtask nupp run lighting -- --headless --frames 5
            # Every real consumer reaches a native service through a guarded
            # require, so a host with no libraries staged looks healthy. This
            # component requires all three directly and raises on the first
            # that will not load.
            - working-directory: tecs
              run: cargo xtask nupp run nativesmoke -- --headless --frames 2

    # The release half of the Nupp path. It is separate from `nupp-host`
    # because it proves a different thing: that half builds and runs out of a
    # checkout, and this half builds an install that carries no path back to
    # the checkout and still runs after it moves.
    #
    # Both supported Unix platforms are covered, because the run path a release
    # records is spelled differently on each and only the platform can say
    # whether its loader honours it for a library opened by name at run time.
    # Windows is not here: no runner in this workflow stages a Nupp SDK for
    # MSVC yet, so `windows-x64` is configured and unproven.
    nupp-package:
        needs: nupp
        strategy:
            matrix:
                include:
                    - os: macos-15
                      preset: macos-arm64
                    - os: ubuntu-latest
                      preset: linux-x64
        runs-on: ${{ matrix.os }}
        env:
            NUPP_REF: b13848d0a8b9d363b7f35f43a8a4c21674ff7025
        steps:
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_REF }}
                  path: nupp
            # `winit`, `wgpu`, `cpal` and `gilrs` each want a development
            # package on Linux, and the host links all four. macOS reaches the
            # same services through frameworks that are already installed.
            - if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
                    libx11-dev libxcursor-dev libxi-dev libxrandr-dev
            - name: Build the Nupp compiler
              working-directory: nupp
              run: |
                  ./bin/nupp build --target bootstrapCompiler
                  echo "$PWD/bin" >> "$GITHUB_PATH"
            - name: Stage the Nupp embedding SDK
              working-directory: tecs
              run: echo "NUPP_SDK=$(../nupp/scripts/toolchain host-library base,native-files,native-net | tail -1)" >> "$GITHUB_ENV"
            # One command: it installs a clean release, holds it to
            # `check-package`, copies it somewhere unrelated, and runs the
            # native smoke component and the showcase from there with every
            # Tecs override removed from the environment.
            - working-directory: tecs
              run: cargo xtask nupp test-package --preset ${{ matrix.preset }}
            # The development preset exists to be told apart from a release.
            # Packaging one and checking it is what keeps that distinction
            # working, since a release passing the gate proves nothing if the
            # gate passes everything. One platform is enough: what it exercises
            # is the preset kind, not the loader, and it pays for a whole debug
            # build of the graphics stack.
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: cargo xtask nupp package --preset ${{ matrix.preset }}-dev
            - if: runner.os == 'macOS'
              working-directory: tecs
              run: cargo xtask nupp check-package

    docs:
        runs-on: macos-15
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: brew install luajit luarocks
            - run: cargo xtask dev-tools
            - run: cargo xtask docs-check
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: cargo xtask docs-build
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out/docs

    deploy-docs:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: github-pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
