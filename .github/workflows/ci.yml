name: ci

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    TECS_WERROR: "1"

jobs:
    rust:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - run: cargo fmt --all -- --check
            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
            - if: runner.os == 'Windows'
              run: cargo check --locked --workspace --all-targets
            - if: runner.os != 'Windows'
              run: cargo test --locked --workspace --all-targets

    engine:
        runs-on: macos-15
        env:
            TECS_EXPECT_GPU_DRIVER: metal
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: cargo xtask deps
            - run: cargo xtask check
            - run: cargo xtask format-check
            - run: cargo xtask test
            - run: cargo xtask test-package --preset macos-arm64

    engine-vulkan:
        runs-on: ubuntu-latest
        env:
            LIBGL_ALWAYS_SOFTWARE: "1"
            SDL_GPU_DRIVER: vulkan
            TECS_EXPECT_GPU_DRIVER: vulkan
        steps:
            - uses: actions/checkout@v4
            - run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential cmake ninja-build pkg-config luajit xvfb \
                    libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
                    libgbm-dev libpulse-dev libudev-dev libvulkan-dev \
                    libwayland-dev libx11-dev libxcursor-dev libxext-dev \
                    libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
                    mesa-vulkan-drivers wayland-protocols
            - run: cargo xtask dev-tools
            - run: xvfb-run -a cargo xtask test --preset linux-x64

    nupp:
        strategy:
            matrix:
                os: [macos-15, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        env:
            # Provisional pin. The rewrite is developed against a 0.0.2-dev
            # compiler and v0.0.1 is the only published release, so this has
            # not been proven to check the tree. Move it to 0.0.2 as soon as
            # that ships, and treat a failure here as the pin being behind
            # rather than as a defect in the tree.
            NUPP_VERSION: v0.0.1
        steps:
            - uses: actions/checkout@v4
            - if: runner.os == 'macOS'
              run: brew install nupp-lang/tap/nupp
            - if: runner.os == 'Linux'
              run: |
                  curl -fsSL -o nupp.tar.gz \
                    "https://github.com/nupp-lang/nupp/releases/download/${NUPP_VERSION}/nupp-linux-x86_64.tar.gz"
                  sudo mkdir -p /opt/nupp
                  sudo tar xzf nupp.tar.gz -C /opt/nupp
                  echo /opt/nupp >> "$GITHUB_PATH"
            - run: nupp fmt --check
            - run: nupp check --strict
            - run: nupp test
            - run: nupp build --target headless
            - run: nupp build --target host
            - run: nupp build --target flatcolor

    nupp-host:
        needs: nupp
        runs-on: macos-15
        env:
            NUPP_VERSION: v0.0.1
        steps:
            - uses: actions/checkout@v4
            - run: brew install nupp-lang/tap/nupp
            - run: nupp build --target flatcolor
            - run: cargo check -p tecs-winit-host
            - run: cargo test -p tecs-winit-host
            - run: cargo run -p tecs-winit-host -- --headless --frames 1

    docs:
        runs-on: macos-15
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: brew install luajit luarocks
            - run: cargo xtask dev-tools
            - run: cargo xtask docs-check
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: cargo xtask docs-build
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out/docs

    deploy-docs:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: github-pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
