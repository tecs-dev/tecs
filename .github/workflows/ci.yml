name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup LuaJIT
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "luajit"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4
      with:
        luarocksVersion: "3.12.2"

    - name: Install dependencies
      run: |
        luarocks install busted
        luarocks install luacov
        git clone --depth 1 https://github.com/teal-language/tl.git /tmp/tl-dev
        cd /tmp/tl-dev && luarocks make tl-dev-1.rockspec

    - name: Build project
      run: |
        make clean
        make compile

    - name: Run tests
      run: |
        make test

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Lua
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "luajit"

    - name: Setup LuaRocks
      uses: leafo/gh-actions-luarocks@v4
      with:
        luarocksVersion: "3.12.2"

    - name: Install Teal
      run: |
        git clone --depth 1 https://github.com/teal-language/tl.git /tmp/tl-dev
        cd /tmp/tl-dev && luarocks make tl-dev-1.rockspec

    - name: Type check
      run: |
        tl check $(find src -name '*.tl')
