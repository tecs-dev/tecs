name: ci

on:
    push:
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    TECS_WERROR: "1"

jobs:
    rust:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - run: cargo fmt --all -- --check
            # `tecs-winit-host` is excluded from everything that builds it here.
            # Its build script links `libnupp.a` out of a Nupp embedding SDK,
            # and staging one needs the Nupp compiler's own checkout and a
            # compiler newer than `rust-toolchain.toml` pins. Neither is present
            # on this job, so the crate's build script fails before Clippy sees
            # a line of it. The `nupp-host` job installs both and covers the
            # crate there. `cargo fmt` needs no build, so it still covers the
            # whole workspace.
            - run: cargo clippy --locked --workspace --exclude tecs-winit-host --all-targets -- -D warnings
            - if: runner.os == 'Windows'
              run: cargo check --locked --workspace --exclude tecs-winit-host --all-targets
            - if: runner.os != 'Windows'
              run: cargo test --locked --workspace --exclude tecs-winit-host --all-targets

    engine:
        runs-on: macos-15
        env:
            TECS_EXPECT_GPU_DRIVER: metal
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: cargo xtask deps
            - run: cargo xtask check
            - run: cargo xtask format-check
            - run: cargo xtask test
            - run: cargo xtask test-package --preset macos-arm64

    engine-vulkan:
        runs-on: ubuntu-latest
        env:
            LIBGL_ALWAYS_SOFTWARE: "1"
            SDL_GPU_DRIVER: vulkan
            TECS_EXPECT_GPU_DRIVER: vulkan
        steps:
            - uses: actions/checkout@v4
            - run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    build-essential cmake ninja-build pkg-config luajit xvfb \
                    libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
                    libgbm-dev libpulse-dev libudev-dev libvulkan-dev \
                    libwayland-dev libx11-dev libxcursor-dev libxext-dev \
                    libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
                    mesa-vulkan-drivers wayland-protocols
            - run: cargo xtask dev-tools
            - run: xvfb-run -a cargo xtask test --preset linux-x64

    nupp:
        strategy:
            matrix:
                os: [macos-15, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        env:
            # Provisional pin. The rewrite is developed against a 0.0.2-dev
            # compiler and v0.0.1 is the only published release, so this has
            # not been proven to check the tree. Move it to 0.0.2 as soon as
            # that ships, and treat a failure here as the pin being behind
            # rather than as a defect in the tree.
            NUPP_VERSION: v0.0.1
        steps:
            - uses: actions/checkout@v4
            - if: runner.os == 'macOS'
              run: brew install nupp-lang/tap/nupp
            - if: runner.os == 'Linux'
              run: |
                  curl -fsSL -o nupp.tar.gz \
                    "https://github.com/nupp-lang/nupp/releases/download/${NUPP_VERSION}/nupp-linux-x86_64.tar.gz"
                  sudo mkdir -p /opt/nupp
                  sudo tar xzf nupp.tar.gz -C /opt/nupp
                  echo /opt/nupp >> "$GITHUB_PATH"
            - run: nupp fmt --check
            - run: nupp check --strict
            # The benchmarks are Nupp programs under an include root, so the two
            # checks above already cover them. Compiling one proves it still
            # runs, which a type check does not: a benchmark that raises during
            # setup type-checks fine.
            - run: nupp run -O2 bench/nupp/signature.nupp
            # The native service tests skip when their library is absent, so
            # building them is what makes the two Nupp-to-Rust bindings
            # covered rather than reported as skipped. The loader finds the
            # Cargo target directory itself; nothing has to be staged.
            - run: cargo build -p tecs-audio -p tecs-physics
            - run: nupp test
            - run: nupp build --target headless
            - run: nupp build --target host
            - run: nupp build --target flatcolor
            # The Nupp reference is generated from the docblocks the checker
            # already reads, so rendering it is what proves a docblock the
            # generator cannot read. Tealdoc resolves a module only through
            # `src/<name>.tl` and covers no Nupp module, so the `docs` job says
            # nothing about this half.
            - run: cargo run -p tecs-xtask -- nupp docs-check

    nupp-host:
        needs: nupp
        runs-on: macos-15
        env:
            NUPP_VERSION: v0.0.1
        steps:
            # Two checkouts side by side. The Nupp compiler release installed by
            # Homebrew ships no `libnupp.a`, so it cannot satisfy
            # `native/rust/winit-host/build.rs`; the embedding SDK is staged by
            # the compiler's own `scripts/toolchain`, which only a source
            # checkout has. `build.rs` searches every ancestor for
            # `nupp/scripts/toolchain`, so `tecs/` beside `nupp/` is the layout
            # it resolves.
            - uses: actions/checkout@v4
              with:
                  path: tecs
            - uses: actions/checkout@v4
              with:
                  repository: nupp-lang/nupp
                  ref: ${{ env.NUPP_VERSION }}
                  path: nupp
            - run: brew install nupp-lang/tap/nupp
            - name: Stage the Nupp embedding SDK
              working-directory: tecs
              run: echo "NUPP_SDK=$(../nupp/scripts/toolchain host-library base,native-files,native-net | tail -1)" >> "$GITHUB_ENV"
            - working-directory: tecs
              run: nupp build --target host
            - working-directory: tecs
              run: nupp build --target flatcolor
            - working-directory: tecs
              run: cargo fmt -p tecs-winit-host -- --check
            - working-directory: tecs
              run: cargo clippy -p tecs-winit-host --all-targets -- -D warnings
            # The host binary carries an `@rpath` reference to the embedding
            # library, so a test binary that linked cleanly still aborts at
            # startup unless the SDK is on the loader path.
            - working-directory: tecs
              env:
                  DYLD_LIBRARY_PATH: ${{ env.NUPP_SDK }}
              run: cargo test -p tecs-winit-host
            - working-directory: tecs
              env:
                  DYLD_LIBRARY_PATH: ${{ env.NUPP_SDK }}
              run: cargo run -p tecs-winit-host -- --headless --frames 1
            - working-directory: tecs
              env:
                  DYLD_LIBRARY_PATH: ${{ env.NUPP_SDK }}
              run: cargo run -p tecs-winit-host -- --component out/nupp/flatcolor.nuppc --entry flatcolor.create --headless --frames 2

    docs:
        runs-on: macos-15
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - run: brew update
            - run: brew install luajit luarocks
            - run: cargo xtask dev-tools
            - run: cargo xtask docs-check
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: cargo xtask docs-build
            - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out/docs

    deploy-docs:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docs
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: github-pages
            cancel-in-progress: false
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
