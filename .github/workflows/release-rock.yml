name: Release rock

# On a version tag (e.g. v0.1.0), publish pinned, immutable releases so users
# can `luarocks install tecs` (no --dev) at a fixed version.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit"
      - uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.12.2"
      - name: Build & upload versioned rockspecs
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          tag="${GITHUB_REF_NAME}"   # e.g. v0.1.0
          ver="${tag#v}"             # e.g. 0.1.0

          # Derive pinned rockspecs from the dev ones: bump the version and
          # pin the source to the tag instead of tracking the main branch.
          sed -e "s/^version = .*/version = \"${ver}-1\"/" \
              -e "s|branch = \"main\"|tag = \"${tag}\"|" \
              tecs-dev-1.rockspec > "tecs-${ver}-1.rockspec"

          # tecs2d also pins its tecs dependency to the same released version.
          sed -e "s/^version = .*/version = \"${ver}-1\"/" \
              -e "s|branch = \"main\"|tag = \"${tag}\"|" \
              -e "s/\"tecs == dev-1\"/\"tecs == ${ver}\"/" \
              tecs2d-dev-1.rockspec > "tecs2d-${ver}-1.rockspec"

          # Upload tecs first so it exists when tecs2d (which depends on it) is published.
          luarocks upload --api-key="$LUAROCKS_API_KEY" "tecs-${ver}-1.rockspec"
          luarocks upload --api-key="$LUAROCKS_API_KEY" "tecs2d-${ver}-1.rockspec"
