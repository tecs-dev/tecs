<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64"
     preserveAspectRatio="xMaxYMid slice" role="img"
     aria-label="A retro arcade horizon with a striped disc and geometric perspective lines">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0.52"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="0.90"/>
      <stop offset="0.84" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.32" stop-color="#110f0d" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#372455" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#dd2020" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="1050" cy="30" r="21"/>
    </clipPath>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="64">
      <rect width="1200" height="64" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- The mask is part of the asset rather than a page effect. The scene is
       fully transparent at the left and takes most of its width to appear. -->
  <g mask="url(#reveal)" opacity="0.8" fill="none" shape-rendering="geometricPrecision">
    <rect x="340" width="860" height="64" fill="url(#horizon)"/>

    <g clip-path="url(#disc)" fill="#dd2020" opacity="0.58">
      <rect x="1028" y="9" width="44" height="3"/>
      <rect x="1028" y="15" width="44" height="3"/>
      <rect x="1028" y="21" width="44" height="3"/>
      <rect x="1028" y="27" width="44" height="3"/>
      <rect x="1028" y="33" width="44" height="3"/>
      <rect x="1028" y="39" width="44" height="3"/>
      <rect x="1028" y="45" width="44" height="3"/>
    </g>

    <!-- Long bands establish the angled horizontal motion without filling the
         shallow strip with scanline noise. -->
    <g stroke="#dd2020" stroke-width="1" opacity="0.34">
      <path d="M360 18 L1018 13"/>
      <path d="M388 25 L1018 22"/>
      <path d="M420 32 L1018 30"/>
      <path d="M454 39 L1018 38"/>
    </g>

    <path d="M500 43 L1200 43" stroke="#dd2020" stroke-width="1.25" opacity="0.42"/>

    <!-- A sparse grid converges at the disc rather than drawing every cell. -->
    <g stroke="#867795" stroke-width="1" opacity="0.46">
      <path d="M1050 43 L650 64"/>
      <path d="M1050 43 L830 64"/>
      <path d="M1050 43 L1010 64"/>
      <path d="M1050 43 L1165 64"/>
      <path d="M1050 43 L1200 53"/>
      <path d="M790 49 L1200 49"/>
      <path d="M728 56 L1200 56"/>
    </g>

    <!-- Two broad facets frame the vanishing point; no natural terrain is
         implied, and the small number of edges keeps them clean at 64px. -->
    <g stroke="#867795" stroke-width="1.15" opacity="0.52">
      <path d="M810 43 L858 25 L905 43 Z M858 25 L858 43"/>
      <path d="M1090 43 L1148 18 L1200 43 M1148 18 L1162 43"/>
    </g>
  </g>
</svg>
