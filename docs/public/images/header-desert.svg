<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64"
     preserveAspectRatio="xMaxYMid slice" role="img"
     aria-label="A desert at sunset: mountains, saguaro cactus and rocks under a low sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24305c"/>
      <stop offset="0.34" stop-color="#5c3f74"/>
      <stop offset="0.60" stop-color="#a85b78"/>
      <stop offset="0.80" stop-color="#d97b6a"/>
      <stop offset="1" stop-color="#e8a463"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8794f"/>
      <stop offset="1" stop-color="#6d4e3a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f7d79a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f7d79a" stop-opacity="0"/>
    </radialGradient>
    <!-- The morph. Baked in rather than applied as a CSS mask, so the header
         keeps one background layer and the nav content paints over it. The
         transition starts left of center so the scene reaches the middle of
         a wide header instead of collecting behind its right-side controls. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#000"/>
      <stop offset="0.22" stop-color="#000"/>
      <stop offset="0.62" stop-color="#fff"/>
      <stop offset="1.00" stop-color="#fff"/>
    </linearGradient>
    <mask id="morph"><rect width="1200" height="64" fill="url(#fade)"/></mask>
  </defs>

  <g mask="url(#morph)">
    <rect width="1200" height="44" fill="url(#sky)"/>
    <circle cx="884" cy="40" r="26" fill="url(#glow)"/>
    <circle cx="884" cy="40" r="9.5" fill="#f9e3ae"/>
    <polygon points="560,44 618,29 662,36 706,23 754,33 812,26 872,34 934,21 996,31 1054,25 1112,33 1160,27 1200,31 1200,44" fill="#4e4270" opacity="0.92"/>
    <polygon points="560,44 606,38 648,41 698,33 748,40 802,35 858,41 918,32 978,39 1036,34 1094,40 1152,35 1200,38 1200,44" fill="#332c47"/>
    <rect y="44" width="1200" height="20" fill="url(#sand)"/>
    <ellipse cx="1042" cy="47" rx="17" ry="3.2" fill="#8a6244" opacity="0.75"/>
    <ellipse cx="742" cy="46" rx="13" ry="2.6" fill="#8a6244" opacity="0.6"/>
    <g fill="#241f33" transform="translate(0 3)"><rect x="979.5" y="29.0" width="5" height="15.0" rx="2.5"/><rect x="974.0" y="35.3" width="3.6" height="6.6" rx="1.8"/><rect x="974.0" y="41.0" width="8" height="3.4" rx="1.7"/><rect x="986.4" y="33.8" width="3.6" height="7.8" rx="1.8"/><rect x="982.0" y="40.4" width="8" height="3.4" rx="1.7"/></g>
    <g fill="#241f33" transform="translate(0 3)"><rect x="1101.5" y="33.0" width="5" height="11.0" rx="2.5"/><rect x="1096.0" y="37.6" width="3.6" height="4.8" rx="1.8"/><rect x="1096.0" y="41.8" width="8" height="3.4" rx="1.7"/><rect x="1108.4" y="36.5" width="3.6" height="5.7" rx="1.8"/><rect x="1104.0" y="41.4" width="8" height="3.4" rx="1.7"/></g>
    <g fill="#2c2640" transform="translate(0 3)"><rect x="803.5" y="35.5" width="5" height="8.5" rx="2.5"/><rect x="798.0" y="39.1" width="3.6" height="3.7" rx="1.8"/><rect x="798.0" y="42.3" width="8" height="3.4" rx="1.7"/><rect x="810.4" y="38.2" width="3.6" height="4.4" rx="1.8"/><rect x="806.0" y="42.0" width="8" height="3.4" rx="1.7"/></g>
    <ellipse cx="1052" cy="50" rx="7" ry="3.4" fill="#241f33"/>
    <ellipse cx="1062" cy="52" rx="4" ry="2.2" fill="#2c2640"/>
    <ellipse cx="900" cy="53" rx="5.5" ry="2.6" fill="#2c2640"/>
    <ellipse cx="1150" cy="49" rx="6" ry="2.8" fill="#241f33"/>
  </g>
</svg>
