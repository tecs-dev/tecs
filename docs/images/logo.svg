<svg width="66" height="37" viewBox="0 0 66 37" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'Jersey15';
        src: url('data:font/woff2;base64,') format('woff2');
      }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#120a1c" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a0612" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060408" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="lensTopLeft" cx="8%" cy="8%" r="45%">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="20%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lensBottomRight" cx="92%" cy="85%" r="35%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nesRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ee5050"/>
      <stop offset="55%" stop-color="#ee5050"/>
      <stop offset="59%" stop-color="#b03030"/>
      <stop offset="100%" stop-color="#b03030"/>
    </linearGradient>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="57" height="4">
      <rect width="57" height="2" fill="transparent"/>
      <rect y="2" width="57" height="2" fill="black" opacity="0.12"/>
    </pattern>
    <linearGradient id="woodTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4E3628"/>
      <stop offset="100%" stop-color="#3A241E"/>
    </linearGradient>
    <linearGradient id="woodLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3628"/>
      <stop offset="100%" stop-color="#3A241E"/>
    </linearGradient>
    <linearGradient id="woodBottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E1A16"/>
      <stop offset="100%" stop-color="#1A100E"/>
    </linearGradient>
    <linearGradient id="woodRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1A16"/>
      <stop offset="100%" stop-color="#1A100E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <rect id="shape" x="3" y="3" width="51" height="31" rx="3"/>
    <clipPath id="screen">
      <use href="#shape"/>
    </clipPath>
    <clipPath id="tvClip">
      <rect x="0" y="0" width="66" height="37" rx="1"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tvClip)">
    <!-- Wood border -->
    <rect x="0" y="0" width="66" height="37" fill="#2E1A16"/>
    <line x1="0" y1="36" x2="66" y2="36" stroke="url(#woodBottom)" stroke-width="1"/>
    <line x1="0" y1="0.5" x2="66" y2="0.5" stroke="url(#woodTop)" stroke-width="1"/>
    <line x1="0.5" y1="0" x2="0.5" y2="37" stroke="url(#woodLeft)" stroke-width="1"/>

    <!-- Control panel -->
    <rect x="56" y="3" width="8" height="31" fill="url(#panelGrad)"/>
    <!-- Dial -->
    <circle cx="60" cy="10" r="2.5" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
    <rect x="59.5" y="8" width="1" height="2" fill="#777" rx="0.3"/>
    <!-- Small dial -->
    <circle cx="60" cy="18" r="1.5" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
    <!-- Speaker grilles -->
    <line x1="57.5" y1="23" x2="62.5" y2="23" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="57.5" y1="24.5" x2="62.5" y2="24.5" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="57.5" y1="26" x2="62.5" y2="26" stroke="#1a1a1a" stroke-width="0.8"/>
    <line x1="57.5" y1="27.5" x2="62.5" y2="27.5" stroke="#1a1a1a" stroke-width="0.8"/>
    <!-- Power LED -->
    <circle cx="60" cy="31" r="0.8" fill="#cc2020" opacity="0.7"/>
    <!-- Right wood border (on top of panel) -->
    <line x1="65.5" y1="0" x2="65.5" y2="37" stroke="url(#woodRight)" stroke-width="1"/>
  </g>
  <!-- Border glow: outer -->
  <rect x="2" y="2" width="53" height="33" rx="4" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
  <!-- Border inner -->
  <rect x="3" y="3" width="51" height="31" rx="3" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- Screen -->
  <use href="#shape" fill="url(#glow)"/>

  <g clip-path="url(#screen)">
    <!-- Text with NES two-tone red -->
    <text x="28.5" y="23.5" text-anchor="middle" font-family="'Jersey15', sans-serif" font-size="26" fill="url(#nesRed)" letter-spacing="0.5">Tecs</text>
    <text x="28.5" y="23.5" text-anchor="middle" font-family="'Jersey15', sans-serif" font-size="26" fill="url(#nesRed)" letter-spacing="0.5">Tecs</text>

<!-- Lens flare top-left -->
    <rect x="0" y="0" width="57" height="37" fill="url(#lensTopLeft)"/>

    <!-- Lens flare bottom-right -->
    <rect x="0" y="0" width="57" height="37" fill="url(#lensBottomRight)"/>

    <!-- Purple underline -->
    <rect x="6" y="28" width="45" height="2" fill="#3d1670"/>
  </g>
</svg>
