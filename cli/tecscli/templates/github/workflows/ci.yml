# Check, test and build on every platform this game can be packaged for.
#
# The matrix is three machines rather than one, and that is not thoroughness:
# it is the only way a solo developer ships to five targets. A macOS host can
# build for macOS and iOS and no other host can, because the Xcode SDK cannot
# be redistributed. A Windows game needs MSVC, which needs Windows. So the
# matrix is where cross-compilation would have been, and `tecs info` on any one
# machine lists what that machine can and cannot produce, with a reason.
name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install tecs
              run: curl -fsSL https://tecs.dev/install.sh | sh

            - name: Type-check
              run: tecs check

            - name: Check formatting
              run: tecs format --check

            - name: Test
              run: tecs test

            - name: Build
              run: tecs build
