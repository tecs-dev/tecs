# Check, test and build on every platform this game can be packaged for.
#
# The matrix is three machines because native SDKs are part of the build. A
# macOS host can produce both macOS architectures, but no other host can carry
# the Xcode SDK. A Windows game needs MSVC, which needs Windows. `tecs info` on
# any one machine lists what that machine can and cannot produce, with a reason.
name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install tecs
              run: curl -fsSL https://tecs.dev/install.sh | sh

            - name: Type-check
              run: tecs check

            - name: Check formatting
              run: tecs format --check

            - name: Test
              run: tecs test

            - name: Dist
              run: tecs dist
