name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Clear LuaRocks cache
        run: rm -rf "$HOME/.cache/luarocks"

      - name: Run luacheck
        run: |
          luarocks --lua-version=5.1 install https://luarocks.org/argparse-0.7.2-1.src.rock
          luarocks --lua-version=5.1 install https://luarocks.org/luafilesystem-1.9.0-1.src.rock
          luarocks --lua-version=5.1 install --deps-mode=none https://luarocks.org/luacheck-1.2.0-1.src.rock
          eval "$(luarocks --lua-version=5.1 path --bin)"
          luacheck tecs_cli spec bin/tecs --codes

  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Tecs
        uses: actions/checkout@v4
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Clear LuaRocks cache
        shell: bash
        run: rm -rf "$HOME/.cache/luarocks"

      - name: Install tecs-cli
        shell: bash
        run: |
          luarocks --lua-version=5.1 install --local https://luarocks.org/ansicolors-1.0.2-3.src.rock
          luarocks --lua-version=5.1 install --local https://luarocks.org/argparse-0.7.2-1.src.rock
          luarocks --lua-version=5.1 install --local https://luarocks.org/luafilesystem-1.9.0-1.src.rock
          luarocks --lua-version=5.1 make --local --deps-mode=none tecs-cli-0.1.0-1.rockspec
          eval "$(luarocks path --local --bin)"
          tecs --version

      - name: Run CLI tests
        shell: bash
        run: |
          eval "$(luarocks path --local --bin)"
          luajit spec/run.lua

      - name: Create and build a starter app
        shell: bash
        env:
          TECS_DIR: ${{ github.workspace }}/tecs
        run: |
          eval "$(luarocks path --local --bin)"
          tecs new "$RUNNER_TEMP/hello-tecs"
          cd "$RUNNER_TEMP/hello-tecs"
          tecs love12
          tecs build
          tecs check

  windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out Tecs
        uses: actions/checkout@v4
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up LuaJIT and LuaRocks
        shell: pwsh
        run: |
          python -m pip install hererocks
          hererocks "$env:RUNNER_TEMP\lua" -j 2.1 -r latest
          "$env:RUNNER_TEMP\lua\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clear LuaRocks cache
        shell: cmd
        run: |
          if exist "%USERPROFILE%\.cache\luarocks" rmdir /S /Q "%USERPROFILE%\.cache\luarocks"
          if exist "%LOCALAPPDATA%\LuaRocks\Cache" rmdir /S /Q "%LOCALAPPDATA%\LuaRocks\Cache"

      - name: Install tecs-cli
        shell: cmd
        run: |
          luarocks --lua-version=5.1 install --local https://luarocks.org/ansicolors-1.0.2-3.src.rock
          luarocks --lua-version=5.1 install --local https://luarocks.org/argparse-0.7.2-1.src.rock
          luarocks --lua-version=5.1 install --local https://luarocks.org/luafilesystem-1.9.0-1.src.rock
          luarocks --lua-version=5.1 make --local --deps-mode=none tecs-cli-0.1.0-1.rockspec
          luarocks path --local --bin > luarocks-path.bat
          call luarocks-path.bat
          tecs --version

      - name: Run CLI tests
        shell: cmd
        run: |
          luarocks path --local --bin > luarocks-path.bat
          call luarocks-path.bat
          luajit spec\run.lua

      - name: Create and build a starter app
        shell: cmd
        env:
          TECS_DIR: ${{ github.workspace }}\tecs
        run: |
          luarocks path --local --bin > luarocks-path.bat
          call luarocks-path.bat
          tecs new "%RUNNER_TEMP%\hello-tecs"
          cd /D "%RUNNER_TEMP%\hello-tecs"
          tecs love12
          tecs build
          tecs check
