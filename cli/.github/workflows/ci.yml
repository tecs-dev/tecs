name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out CLI
        uses: actions/checkout@v4

      - name: Check out Tecs
        uses: actions/checkout@v4
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Build tecs-cli.love
        env:
          TECS_DIR: ${{ github.workspace }}/tecs
        run: scripts/build_love.sh

      - name: Prove option 1 from a cold cache
        env:
          TECS_CACHE_DIR: ${{ runner.temp }}/tecs-cache
          TECS_CLI_LOVE: ${{ github.workspace }}/dist/tecs-cli.love
        run: |
          project="$RUNNER_TEMP/hello-tecs"
          rm -rf "$project" "$TECS_CACHE_DIR"
          launcher/tecs --version
          launcher/tecs new "$project"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" check)
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" build)
          test -f "$project/build/main.lua"
          test -f "$project/build/tecs2d/init.lua"
          test -f "$project/build/tecs2d/assets/fonts/tiny-font.fnt"
          test -f "$project/build/tecs2d/assets/fonts/tiny-font.png"
          launcher/tecs --version

      - name: Upload option 1 package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tecs-cli-option1
          path: |
            dist/tecs
            dist/tecs.cmd
            dist/tecs.ps1
            dist/tecs-cli.love
            dist/install.sh
            dist/install.ps1

  windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Check out CLI
        uses: actions/checkout@v4

      - name: Check out Tecs
        uses: actions/checkout@v4
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Build tecs-cli.love
        shell: bash
        env:
          TECS_DIR: ${{ github.workspace }}/tecs
        run: scripts/build_love.sh

      - name: Prove option 1 from a cold cache
        shell: pwsh
        env:
          TECS_CACHE_DIR: ${{ runner.temp }}\tecs-cache
          TECS_CLI_LOVE: ${{ github.workspace }}\dist\tecs-cli.love
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $project = Join-Path $env:RUNNER_TEMP "hello-tecs"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $project, $env:TECS_CACHE_DIR
          & launcher/tecs.ps1 --version
          & launcher/tecs.ps1 new $project
          Push-Location $project
          Remove-Item Env:TECS_DIR -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" check
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" build
          Pop-Location
          if (-not (Test-Path "$project\build\main.lua")) { throw "main.lua was not built" }
          if (-not (Test-Path "$project\build\tecs2d\init.lua")) { throw "tecs2d was not built" }
          if (-not (Test-Path "$project\build\tecs2d\assets\fonts\tiny-font.fnt")) { throw "BMFont descriptor was not built" }
          if (-not (Test-Path "$project\build\tecs2d\assets\fonts\tiny-font.png")) { throw "BMFont texture was not built" }
          & launcher/tecs.ps1 --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download option 1 package
        uses: actions/download-artifact@v4
        with:
          name: tecs-cli-option1
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tecs
            dist/tecs.cmd
            dist/tecs.ps1
            dist/tecs-cli.love
            dist/install.sh
            dist/install.ps1
