name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out CLI
        uses: actions/checkout@v7

      - name: Check out Tecs
        uses: actions/checkout@v7
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        run: |
          version=$(sed -n 's/^local VERSION = "\([^"]*\)"/\1/p' tecs_cli/cli.lua)
          test "$GITHUB_REF_NAME" = "v$version"
          grep -F "## [$version] -" CHANGELOG.md

      - name: Build tecs-cli.love
        env:
          TECS_DIR: ${{ github.workspace }}/tecs
        run: scripts/build_love.sh

      - name: Prove option 1 from a cold cache
        env:
          TECS_CACHE_DIR: ${{ runner.temp }}/tecs-cache
          TECS_CLI_LOVE: ${{ github.workspace }}/dist/tecs-cli.love
        run: |
          project="$RUNNER_TEMP/hello-tecs"
          rm -rf "$project" "$TECS_CACHE_DIR"
          launcher/tecs --version
          launcher/tecs info
          launcher/tecs new "$project"
          test -f "$project/.github/workflows/ci.yml"
          (cd "$project" && TECS_DIR="$GITHUB_WORKSPACE/tecs" "$GITHUB_WORKSPACE/launcher/tecs" dev)
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" check)
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" build)
          test -f "$project/build/main.lua"
          test -f "$project/build/tecs2d/init.lua"
          test -f "$project/build/tecs2d/assets/fonts/tiny-font.fnt"
          test -f "$project/build/tecs2d/assets/fonts/tiny-font.png"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" add inspect)
          test -f "$project/src/vendor/share/lua/5.1/inspect.lua"
          test -f "$project/src/vendor/share/lua/5.1/inspect.d.tl"
          printf '%s\n' \
            'local inspect <const> = require("inspect")' \
            'local debugutil <const> = {' \
            '    dump = function(value: any): string' \
            '        return inspect(value)' \
            '    end,' \
            '}' \
            'return debugutil' > "$project/src/debugutil.tl"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" check)
          test -f "$project/tecs-rocks.lua"
          rm -rf "$project/src/vendor"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" check)
          test -f "$project/src/vendor/share/lua/5.1/inspect.lua"
          test -f "$project/src/vendor/share/lua/5.1/inspect.d.tl"
          rm "$project/src/debugutil.tl"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" remove inspect)
          test ! -e "$project/src/vendor/share/lua/5.1/inspect.lua"
          test ! -e "$project/src/vendor/share/lua/5.1/inspect.d.tl"
          if [ "$(uname -s)" = Darwin ]; then
            (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" integ)
            (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" dist)
            test -f "$project/dist/hello-tecs.love"
            test -f "$project/dist/macos/hello-tecs.app/Contents/Resources/hello-tecs.love"
            grep -q "org.tecs2d.hello-tecs" "$project/dist/macos/hello-tecs.app/Contents/Info.plist"
            test -f "$project/dist/hello-tecs-macos.zip"
          else
            (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" dist windows)
          fi
          test -f "$project/dist/windows/hello-tecs/hello-tecs.exe"
          test -f "$project/dist/hello-tecs-windows.zip"
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" check --json | grep -F '"ok":true')
          (cd "$project" && env -u TECS_DIR "$GITHUB_WORKSPACE/launcher/tecs" info --json | grep -F '"built":true')
          launcher/tecs agent list | grep -F tecs-project
          test -f "$(launcher/tecs agent path tecs-project)"
          launcher/tecs completions bash | grep -F '_tecs()'
          launcher/tecs completions zsh > /dev/null
          launcher/tecs completions fish > /dev/null
          launcher/tecs --version

      - name: Package versioned archives
        if: matrix.os == 'ubuntu-latest'
        run: scripts/package_dist.sh

      - name: Create release checksums
        if: matrix.os == 'ubuntu-latest'
        working-directory: dist
        run: |
          sha256sum tecs tecs.cmd tecs.ps1 tecs-cli.love install.sh install.ps1 \
            LICENSE CHANGELOG.md tecs-cli-*.tar.gz tecs-cli-*-windows.zip > SHA256SUMS

      - name: Upload option 1 package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tecs-cli-option1
          path: |
            dist/tecs
            dist/tecs.cmd
            dist/tecs.ps1
            dist/tecs-cli.love
            dist/install.sh
            dist/install.ps1
            dist/LICENSE
            dist/CHANGELOG.md
            dist/SHA256SUMS
            dist/tecs-cli-*.tar.gz
            dist/tecs-cli-*-windows.zip

  windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - name: Check out CLI
        uses: actions/checkout@v7

      - name: Check out Tecs
        uses: actions/checkout@v7
        with:
          repository: tecs-dev/tecs
          path: tecs

      - name: Build tecs-cli.love
        shell: bash
        env:
          TECS_DIR: ${{ github.workspace }}/tecs
        run: scripts/build_love.sh

      - name: Prove option 1 from a cold cache
        shell: pwsh
        env:
          TECS_CACHE_DIR: ${{ runner.temp }}\tecs-cache
          TECS_CLI_LOVE: ${{ github.workspace }}\dist\tecs-cli.love
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $project = Join-Path $env:RUNNER_TEMP "hello-tecs"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $project, $env:TECS_CACHE_DIR
          & launcher/tecs.ps1 --version
          & launcher/tecs.ps1 info
          & launcher/tecs.ps1 new $project
          Push-Location $project
          $env:TECS_DIR = Join-Path $env:GITHUB_WORKSPACE "tecs"
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" dev
          Remove-Item Env:TECS_DIR -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" check
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" build
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" add inspect
          if (-not (Test-Path "src\vendor\share\lua\5.1\inspect.lua")) { throw "inspect was not vendored" }
          if (-not (Test-Path "src\vendor\share\lua\5.1\inspect.d.tl")) { throw "inspect types were not vendored" }
          @(
            'local inspect <const> = require("inspect")'
            'local debugutil <const> = {'
            '    dump = function(value: any): string'
            '        return inspect(value)'
            '    end,'
            '}'
            'return debugutil'
          ) | Set-Content "src\debugutil.tl"
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" check
          Remove-Item "src\debugutil.tl"
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" remove inspect
          if (Test-Path "src\vendor\share\lua\5.1\inspect.lua") { throw "inspect was not removed" }
          $checkJson = (& "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" check --json | Out-String)
          if ($checkJson -notmatch '"ok":true') { throw "check --json did not report ok" }
          $infoJson = (& "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" info --json | Out-String)
          if ($infoJson -notmatch '"built":true') { throw "info --json did not report a built project" }
          & "$env:GITHUB_WORKSPACE\launcher\tecs.ps1" dist windows
          if (-not (Test-Path "dist\windows\hello-tecs\hello-tecs.exe")) { throw "dist did not fuse the exe" }
          if (-not (Test-Path "dist\hello-tecs-windows.zip")) { throw "dist did not zip the Windows build" }
          Pop-Location
          if (-not (Test-Path "$project\build\main.lua")) { throw "main.lua was not built" }
          if (-not (Test-Path "$project\build\tecs2d\init.lua")) { throw "tecs2d was not built" }
          if (-not (Test-Path "$project\build\tecs2d\assets\fonts\tiny-font.fnt")) { throw "BMFont descriptor was not built" }
          if (-not (Test-Path "$project\build\tecs2d\assets\fonts\tiny-font.png")) { throw "BMFont texture was not built" }
          $agents = (& launcher/tecs.ps1 agent list | Out-String)
          if ($agents -notmatch 'tecs-project') { throw "agent list is missing tecs-project" }
          $agentPath = (& launcher/tecs.ps1 agent path tecs-project | Out-String).Trim()
          if (-not (Test-Path $agentPath)) { throw "agent path did not write $agentPath" }
          $completions = (& launcher/tecs.ps1 completions bash | Out-String)
          if ($completions -notmatch '_tecs') { throw "completions bash did not print a script" }
          & launcher/tecs.ps1 --version

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download option 1 package
        uses: actions/download-artifact@v8
        with:
          name: tecs-cli-option1
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/tecs
            dist/tecs.cmd
            dist/tecs.ps1
            dist/tecs-cli.love
            dist/install.sh
            dist/install.ps1
            dist/LICENSE
            dist/CHANGELOG.md
            dist/SHA256SUMS
            dist/tecs-cli-*.tar.gz
            dist/tecs-cli-*-windows.zip

      # Releases published with GITHUB_TOKEN do not fire `release` triggers,
      # so start the post-publication smoke run explicitly.
      - name: Dispatch release smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Release smoke" --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
