name: Release rock

# When the rockspec on main carries a version (or rockspec revision) that is
# not yet on luarocks.org, push the matching v* git tag if it is new (the
# rockspec's source pins that tag) and publish the rock so users can
# `luarocks install tecs-cli`. Requires the LUAROCKS_API_KEY secret. A rerun
# after a failed upload publishes normally, since the version is still absent
# from luarocks.org.
on:
  # PAUSED: automatic publishing is disabled until CI is stable. To resume,
  # restore the push trigger below. Publishing can still be run manually via
  # workflow_dispatch in the meantime.
  #
  # push:
  #   branches: [main]
  #   paths:
  #     - '*.rockspec'
  #     - '.github/workflows/release-rock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "luajit-2.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Detect unpublished version
        id: version
        run: |
          rockspec=$(ls tecs-cli-*.rockspec | sort -V | tail -n 1)
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' "$rockspec")   # e.g. 0.1.0-1
          tag="v${ver%-*}"                                        # e.g. v0.1.0

          # The rockspec's pinned source tag must match its version.
          spec_tag=$(sed -n 's/.*tag = "\(v[^"]*\)".*/\1/p' "$rockspec")
          if [ "$spec_tag" != "$tag" ]; then
            echo "rockspec source tag ($spec_tag) does not match version tag ($tag)" >&2
            exit 1
          fi

          echo "rockspec=$rockspec" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if luarocks search tecs-cli --porcelain | awk '{print $1, $2}' | grep -qxF "tecs-cli $ver"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tecs-cli $ver is already on luarocks.org; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          # A rockspec-revision bump reuses the existing version tag.
          tag="${{ steps.version.outputs.tag }}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Upload rock
        if: steps.version.outputs.publish == 'true'
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          luarocks upload --api-key="$LUAROCKS_API_KEY" "${{ steps.version.outputs.rockspec }}"
