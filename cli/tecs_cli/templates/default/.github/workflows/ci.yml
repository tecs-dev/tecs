# Generated by `tecs new`: type-check and build the game on every push using
# the published Tecs CLI. Edit or delete freely — nothing else depends on it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: tecs-dev/setup-tecs@v1
      - run: tecs check
      - run: tecs build
      # Integration specs launch a real game window; macOS runners have a
      # display, Linux CI runners do not.
      - if: runner.os == 'macOS'
        run: tecs integ
